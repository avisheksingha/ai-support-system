global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080' # api-gateway
          - 'host.docker.internal:8081' # auth-service
          - 'host.docker.internal:8082' # ticket-service
          - 'host.docker.internal:8083' # ai-analysis-service
          - 'host.docker.internal:8084' # routing-service
          - 'host.docker.internal:8085' # rag-service
          - 'host.docker.internal:8086' # ai-orchestration-service
          - 'host.docker.internal:8761' # discovery-service
